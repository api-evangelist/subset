name: Subset
description: 'Subset is an AI-powered spreadsheet editor built for finance professionals, letting
  them generate P&L statements from PDFs, build DCF and returns models, and process CIMs and teasers
  through natural-language instructions inside a familiar spreadsheet interface. Built in NYC and SF
  by former Wall Street professionals, Subset targets investment and financial-modeling workflows. It
  was surfaced as a portfolio company of Index Ventures and added to the API Evangelist network. As of
  this enrichment pass Subset ships a consumer/prosumer web application and help documentation but no
  public developer API, OpenAPI specification, SDKs, or webhook surface.'
